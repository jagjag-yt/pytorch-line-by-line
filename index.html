<!doctype html>
<html lang="ja">
<head>

<title>一行ずつ読むPyTorch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* レイアウト: 左にコード(エディタ風・常に暗め)、右に「いまの1行」の解説カード。狭い画面では上下に積む */
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --fg: #18202c;
  --muted: #5a6779;
  --line: #d6dce5;
  --accent: #1f4fc4;
  --accent-soft: #e3eafb;
  --warn: #b3410e;
  --warn-soft: #fbe9df;
  --ok: #1d7a55;
  --code-bg: #131a24;
  --code-fg: #d5dce6;
  --code-dim: #6c7a8e;
  --code-gutter: #4a5568;
  --code-cur: rgba(98, 146, 255, .24);
  --code-cur-edge: #6f9bff;
  --code-sec: #1b2431;
  --t-kw: #92b6ff;
  --t-str: #e7c27d;
  --t-num: #f1a37e;
  --t-fn: #7fd7c4;
  --t-bi: #d6a2f2;
  --pt: #1f4fc4;
  --pt-alt: #b3410e;
  --font-ui: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --font-code: "JetBrains Mono", "Consolas", "BIZ UDGothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #171e28; --fg: #e3e8ef; --muted: #98a5b8; --line: #2a3442;
    --accent: #7ea2ff; --accent-soft: #1d2a45; --warn: #ff9a66; --warn-soft: #3a2218; --ok: #5fd0a0;
    --code-bg: #0b1017; --code-sec: #121924; --pt: #7ea2ff; --pt-alt: #ff9a66; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #171e28; --fg: #e3e8ef; --muted: #98a5b8; --line: #2a3442;
  --accent: #7ea2ff; --accent-soft: #1d2a45; --warn: #ff9a66; --warn-soft: #3a2218; --ok: #5fd0a0;
  --code-bg: #0b1017; --code-sec: #121924; --pt: #7ea2ff; --pt-alt: #ff9a66; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.7; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; height: 100%; }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--panel);
}
.brand { font-weight: 700; font-size: 16px; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }
.spacer { flex: 1; }
.counter { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

main.grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: minmax(0, 1fr); }
@media (max-width: 900px) {
  .app { height: auto; }
  main.grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; }
  .vispane { overflow: visible; }
  .codepane { height: 46vh; }
}

/* 左: コード */
.codepane { display: flex; flex-direction: column; min-height: 0; background: var(--code-bg); color: var(--code-fg); }
.nav {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  border-bottom: 1px solid #263142;
}
.nav button {
  background: #1f2a3a; border: 1px solid #33425a; color: #e7edf6; border-radius: 8px;
  padding: 6px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
}
.nav button:hover { background: #283650; }
.nav .hint { color: var(--code-dim); font-size: 12px; margin-left: auto; }
.code { position: relative; flex: 1; overflow: auto; padding: 8px 0 40vh; font-family: var(--font-code); font-size: 13px; line-height: 1.65; }
.md { padding: 14px 16px 6px; font-family: var(--font-ui); color: #aebbd0; }
.md .h1 { font-size: 17px; font-weight: 700; color: #eef3fa; }
.md .h2 { font-size: 15px; font-weight: 700; color: #dfe7f3; }
.md .h3 { font-size: 13.5px; font-weight: 500; color: #c3cfdf; }
.md .p { font-size: 12px; color: var(--code-dim); white-space: pre-wrap; }
.cell { margin: 6px 0 10px; border-left: 2px solid transparent; }
.cell .lab { font-size: 11px; color: var(--code-gutter); padding: 0 16px; }
.ln { display: grid; grid-template-columns: 34px 14px minmax(0, 1fr); cursor: pointer; white-space: pre; }
.ln:hover { background: rgba(255, 255, 255, .04); }
.ln .no { color: var(--code-gutter); text-align: right; padding-right: 4px; user-select: none; }
.ln .mk { color: transparent; text-align: center; user-select: none; }
.ln.has .mk { color: var(--code-cur-edge); }
.ln .tx { padding-right: 16px; }
.ln.dim .tx { opacity: .55; }
.ln.cur { background: var(--code-cur); }
.ln.cur .no { color: #fff; }
.ln.cur .tx { opacity: 1; }
.ln.cur.first { box-shadow: inset 3px 0 0 var(--code-cur-edge); }
.ln.cur:not(.first) { box-shadow: inset 3px 0 0 var(--code-cur-edge); }
.t-kw { color: var(--t-kw); } .t-str { color: var(--t-str); } .t-num { color: var(--t-num); }
.t-fn { color: var(--t-fn); } .t-bi { color: var(--t-bi); } .t-com { color: var(--code-dim); font-style: italic; }

/* 右: 解説 */
.vispane { overflow: auto; min-height: 0; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.vis { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.crumb { font-size: 12px; color: var(--muted); letter-spacing: .03em; }
.crumb b { color: var(--fg); font-weight: 500; }
.headrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tag { font-size: 11px; letter-spacing: .08em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.tag.sub { background: transparent; border: 1px solid var(--line); color: var(--muted); }
h2.title { margin: 0; font-size: 24px; line-height: 1.35; text-wrap: balance; }
.echo { font-family: var(--font-code); font-size: 13px; background: var(--code-bg); color: var(--code-fg); padding: 10px 14px; border-radius: 8px; overflow-x: auto; white-space: pre; }
.block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.block > .lbl { font-size: 11px; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.say { font-size: 16px; line-height: 1.85; max-width: 62ch; }
.say code, .note code { font-family: var(--font-code); font-size: .9em; background: var(--accent-soft); padding: 0 4px; border-radius: 4px; }
.eqs { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; overflow-x: auto; font-size: 17px; }
.eqs .eq { min-width: max-content; }
.vals { display: flex; flex-direction: column; gap: 10px; min-width: 0; overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-family: var(--font-code); font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; }
.chip b { color: var(--accent); font-weight: 600; }
table.t { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13.5px; background: var(--panel); }
table.t th, table.t td { border: 1px solid var(--line); padding: 4px 10px; text-align: right; }
table.t th { font-weight: 500; color: var(--muted); background: var(--bg); }
.note { font-size: 13.5px; color: var(--muted); line-height: 1.75; max-width: 66ch; }
.callout { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-width: 0; }
.chart .ct { font-size: 12px; color: var(--muted); padding: 2px 6px 0; }
svg.plot { width: 100%; height: auto; display: block; }
svg.plot .grid { stroke: var(--line); stroke-width: 1; }
svg.plot .axis { stroke: var(--muted); stroke-width: 1; }
svg.plot text { fill: var(--muted); font-size: 11px; font-family: var(--font-ui); }
svg.plot .pt { fill: var(--pt); fill-opacity: .55; }
svg.plot .pt.solid { fill-opacity: 1; }
svg.plot .pt.alt { fill: var(--pt-alt); }
svg.plot .pt.big { fill-opacity: .8; }
svg.plot .ln1 { stroke: var(--fg); stroke-width: 2.2; fill: none; }
svg.plot .ln2 { stroke: var(--pt-alt); stroke-width: 2; fill: none; }
svg.plot .ln3 { stroke: var(--accent); stroke-width: 2; fill: none; }
svg.plot .dash { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
svg.plot .mark { fill: var(--pt-alt); }
svg.plot .marklbl { fill: var(--fg); font-weight: 700; }
.player { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.player input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.player button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 12px; cursor: pointer; }
.player .ep { font-variant-numeric: tabular-nums; font-family: var(--font-code); font-size: 13px; min-width: 9ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; font-variant-numeric: tabular-nums; }
.stats div { display: flex; flex-direction: column; }
.stats span { font-size: 11px; color: var(--muted); letter-spacing: .05em; }
.stats b { font-family: var(--font-code); font-size: 16px; font-weight: 600; }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; }
.flow span.s { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 10px; }
.flow span.a { color: var(--muted); }
.placeholder { padding: 40px 0; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">一行ずつ読むPyTorch <small>コードの各行がどんな計算をしているか</small></div>
    <div class="seg" id="tabs" role="group" aria-label="ノートブック"></div>
    <div class="seg" id="mode" role="group" aria-label="表示する行">
      <button type="button" id="mode-key" aria-pressed="true">要点の行だけ</button>
      <button type="button" id="mode-all" aria-pressed="false">すべての行</button>
    </div>
    <div class="spacer"></div>
    <div class="counter" id="counter"></div>
  </header>
  <main class="grid">
    <section class="codepane" aria-label="コード">
      <div class="nav">
        <button type="button" id="prev" aria-label="前の行へ">↑ 前へ</button>
        <button type="button" id="next" aria-label="次の行へ">↓ 次へ</button>
        <span class="hint">キーボードの ↑ ↓ でも進めます。行をクリックするとその行へ飛びます</span>
      </div>
      <div class="code" id="code"></div>
    </section>
    <section class="vispane" id="vispane" aria-live="polite">
      <div class="vis" id="vis"></div>
    </section>
  </main>
</div>

<script>
const DATA = {"nb": {"ch05": {"title": "5章 線形回帰", "file": "ch05_regression.ipynb", "cells": [{"t": "md", "s": "# 5章　線形回帰"}, {"t": "code", "s": "# 必要ライブラリの導入\n\n!pip install japanize_matplotlib | tail -n 1\n!pip install torchviz | tail -n 1\n!pip install torchinfo | tail -n 1"}, {"t": "code", "s": "# 必要ライブラリのインポート\n\n%matplotlib inline\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nimport japanize_matplotlib\nfrom IPython.display import display"}, {"t": "code", "s": "import torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torchviz import make_dot"}, {"t": "code", "s": "# デフォルトフォントサイズ変更\nplt.rcParams['font.size'] = 14\n\n# デフォルトグラフサイズ変更\nplt.rcParams['figure.figsize'] = (6,6)\n\n# デフォルトで方眼表示ON\nplt.rcParams['axes.grid'] = True\n\n# numpyの浮動小数点の表示精度\nnp.set_printoptions(suppress=True, precision=4)"}, {"t": "md", "s": "## 5.3 線形関数(nn.Linear)"}, {"t": "md", "s": "###  入力:1 出力:1 の線形関数"}, {"t": "code", "s": "# 乱数の種固定\ntorch.manual_seed(123)\n\n# 入力:1 出力:1 の線形関数の定義\nl1 = nn.Linear(1, 1)\n\n# 線形関数の表示\nprint(l1)"}, {"t": "code", "s": "# パラメータ名、パラメータ値、shapeの表示\n\nfor param in l1.named_parameters():\n    print('name: ', param[0])\n    print('tensor: ', param[1])\n    print('shape: ', param[1].shape)"}, {"t": "code", "s": "# 初期値設定\nnn.init.constant_(l1.weight, 2.0)\nnn.init.constant_(l1.bias, 1.0)\n\n# 結果確認\nprint(l1.weight)\nprint(l1.bias)"}, {"t": "code", "s": "# テスト用データ生成\n\n# x_npをnumpy配列で定義\nx_np = np.arange(-2, 2.1, 1)\n\n# Tensor化\nx = torch.tensor(x_np).float()\n\n# サイズを(N,1)に変更\nx = x.view(-1,1)\n\n# 結果確認\nprint(x.shape)\nprint(x)"}, {"t": "code", "s": "# 1次関数のテスト\n\ny = l1(x)\n\nprint(y.shape)\nprint(y.data)"}, {"t": "md", "s": "### 入力:2 出力:1 の線形関数"}, {"t": "code", "s": "# 入力:2 出力:1 の線形関数の定義\nl2 = nn.Linear(2, 1)\n\n# 初期値設定\nnn.init.constant_(l2.weight, 1.0)\nnn.init.constant_(l2.bias, 2.0)\n\n# 結果確認\nprint(l2.weight)\nprint(l2.bias)"}, {"t": "code", "s": "# 2次元numpy配列\nx2_np = np.array([[0, 0], [0, 1], [1, 0], [1,1]])\n\n# Tensor化\nx2 =  torch.tensor(x2_np).float()\n\n# 結果確認\nprint(x2.shape)\nprint(x2)"}, {"t": "code", "s": "\n# 関数値計算\ny2 = l2(x2)\n\n# shape確認\nprint(y2.shape)\n\n# 値確認\nprint(y2.data)"}, {"t": "md", "s": "### 入力:2 出力:3 の線形関数"}, {"t": "code", "s": "# 入力:2 出力:3 の線形関数の定義\n\nl3 = nn.Linear(2, 3)\n\n# 初期値設定\nnn.init.constant_(l3.weight[0,:], 1.0)\nnn.init.constant_(l3.weight[1,:], 2.0)\nnn.init.constant_(l3.weight[2,:], 3.0)\nnn.init.constant_(l3.bias, 2.0)\n\n# 結果確認\nprint(l3.weight)\nprint(l3.bias)"}, {"t": "code", "s": "# 関数値計算\ny3 = l3(x2)\n\n# shape確認\nprint(y3.shape)\n\n# 値確認\nprint(y3.data)"}, {"t": "md", "s": "## 5.4 カスタムクラスを利用したモデル定義"}, {"t": "code", "s": "# モデルのクラス定義\n\nclass Net(nn.Module):\n    def __init__(self, n_input, n_output):\n        #  親クラスnn.Modulesの初期化呼び出し\n        super().__init__()\n\n        # 出力層の定義\n        self.l1 = nn.Linear(n_input, n_output)\n\n    # 予測関数の定義\n    def forward(self, x):\n        x1 = self.l1(x) # 線形回帰\n        return x1"}, {"t": "code", "s": "# ダミー入力\ninputs = torch.ones(100,1)\n\n# インスタンスの生成 (１入力1出力の線形モデル)\nn_input = 1\nn_output = 1\nnet = Net(n_input, n_output)\n\n# 予測\noutputs = net(inputs)"}, {"t": "md", "s": "\n## 5.6 データ準備\nUCI公開データセットのうち、回帰でよく使われる「ボストン・データセット」を用いる。  \n\nhttps://www.cs.toronto.edu/~delve/data/boston/bostonDetail.html\n\nオリジナルのデーセットは、17項目の入力値から、不動産価格を予測する目的のものだが、\n一番単純な「単回帰モデル」(1入力)のモデルを作るため、このうち``RM``の1項目だけを抽出する。\n"}, {"t": "code", "s": "# 学習用データ準備\n\n# 「ボストン・データセット」はscikit-learnのライブラリでも取得できるが、\n# その場合、将来版で利用できなくなる予定のため、別Webサイトから取得する\ndata_url = \"http://lib.stat.cmu.edu/datasets/boston\"\nraw_df = pd.read_csv(data_url, sep=\"\\s+\",\n    skiprows=22, header=None)\nx_org = np.hstack([raw_df.values[::2, :],\n    raw_df.values[1::2, :2]])\nyt = raw_df.values[1::2, 2]\nfeature_names = np.array(['CRIM', 'ZN', 'INDUS', 'CHAS', 'NOX',\n    'RM', 'AGE', 'DIS', 'RAD', 'TAX', 'PTRATIO','B', 'LSTAT'])\n\n# 結果確認\nprint('元データ', x_org.shape, yt.shape)\nprint('項目名: ', feature_names)"}, {"t": "code", "s": "# データ絞り込み (項目 RMのみ)\nx = x_org[:,feature_names == 'RM']\nprint('絞り込み後', x.shape)\nprint(x[:5,:])\n\n# 正解データ yの表示\nprint('正解データ')\nprint(yt[:5])"}, {"t": "code", "s": "# 散布図の表示\n\nplt.scatter(x, yt, s=10, c='b')\nplt.xlabel('部屋数')\nplt.ylabel('価格')\nplt.title('部屋数と価格の散布図')\nplt.show()"}, {"t": "md", "s": "## 5.7 モデル定義"}, {"t": "code", "s": "# 変数定義\n\n# 入力次元数\nn_input= x.shape[1]\n\n# 出力次元数\nn_output = 1\n\nprint(f'入力次元数: {n_input}  出力次元数: {n_output}')"}, {"t": "code", "s": "# 機械学習モデル（予測モデル）クラス定義\n\nclass Net(nn.Module):\n    def __init__(self, n_input, n_output):\n        #  親クラスnn.Modulesの初期化呼び出し\n        super().__init__()\n\n        # 出力層の定義\n        self.l1 = nn.Linear(n_input, n_output)\n\n        # 初期値を全部1にする\n        # 「ディープラーニングの数学」と条件を合わせる目的\n        nn.init.constant_(self.l1.weight, 1.0)\n        nn.init.constant_(self.l1.bias, 1.0)\n\n    # 予測関数の定義\n    def forward(self, x):\n        x1 = self.l1(x) # 線形回帰\n        return x1"}, {"t": "code", "s": "# インスタンスの生成\n# １入力1出力の線形モデル\n\nnet = Net(n_input, n_output)"}, {"t": "code", "s": "# モデル内のパラメータの確認\n# モデル内の変数取得にはnamed_parameters関数を利用する\n# 結果の第1要素が名前、第2要素が値\n#\n# predict.weightとpredict.biasがあることがわかる\n# 初期値はどちらも1.0になっている\n\nfor parameter in net.named_parameters():\n    print(f'変数名: {parameter[0]}')\n    print(f'変数値: {parameter[1].data}')"}, {"t": "code", "s": "# パラメータのリスト取得にはparameters関数を利用する\n\nfor parameter in net.parameters():\n    print(parameter)"}, {"t": "md", "s": "### モデル確認"}, {"t": "code", "s": "# モデルの概要表示\n\nprint(net)"}, {"t": "code", "s": "# モデルのサマリー表示\n\nfrom torchinfo import summary\nsummary(net, (1,))"}, {"t": "md", "s": "### 損失関数と最適化関数"}, {"t": "code", "s": "# 損失関数： 平均2乗誤差\ncriterion = nn.MSELoss()\n\n# 学習率\nlr = 0.01\n\n# 最適化関数: 勾配降下法\noptimizer = optim.SGD(net.parameters(), lr=lr)\n"}, {"t": "md", "s": "## 5.8 勾配降下法"}, {"t": "code", "s": "# 入力変数x と正解値 ytのテンソル変数化\n\ninputs = torch.tensor(x).float()\nlabels = torch.tensor(yt).float()\n\n# 次元数確認\n\nprint(inputs.shape)\nprint(labels.shape)"}, {"t": "code", "s": "# 損失値計算用にlabels変数を(N,1)次元の行列に変換する\n\nlabels1 = labels.view((-1, 1))\n\n# 次元数確認\nprint(labels1.shape)"}, {"t": "code", "s": "# 予測計算\n\noutputs = net(inputs)"}, {"t": "code", "s": "\n#  損失計算\nloss = criterion(outputs, labels1)\n\n# 損失値の取得\nprint(f'{loss.item():.5f}')"}, {"t": "code", "s": "\n# 損失の計算グラフ可視化\n\ng = make_dot(loss, params=dict(net.named_parameters()))\ndisplay(g)"}, {"t": "code", "s": "# 予測計算\noutputs = net(inputs)\n\n#  損失計算\nloss = criterion(outputs, labels1)\n\n# 勾配計算\nloss.backward()\n\n# 勾配の結果が取得可能に\nprint(net.l1.weight.grad)\nprint(net.l1.bias.grad)"}, {"t": "code", "s": "# パラメータ修正\noptimizer.step()\n\n# パラメータ値が変わる\nprint(net.l1.weight)\nprint(net.l1.bias)"}, {"t": "code", "s": "# 勾配値の初期化\noptimizer.zero_grad()\n\n# 勾配値がすべてゼロになっている\nprint(net.l1.weight.grad)\nprint(net.l1.bias.grad)"}, {"t": "md", "s": "### 繰り返し計算"}, {"t": "code", "s": "# 学習率\nlr = 0.01\n\n# インスタンス生成　(パラメータ値初期化)\nnet = Net(n_input, n_output)\n\n# 損失関数： 平均2乗誤差\ncriterion = nn.MSELoss()\n\n# 最適化関数: 勾配降下法\noptimizer = optim.SGD(net.parameters(), lr=lr)\n\n# 繰り返し回数\nnum_epochs = 50000\n\n# 評価結果記録用 (損失関数値のみ記録)\nhistory = np.zeros((0,2))"}, {"t": "code", "s": "# 繰り返し計算メインループ\n\nfor epoch in range(num_epochs):\n\n    # 勾配値初期化\n    optimizer.zero_grad()\n\n    # 予測計算\n    outputs = net(inputs)\n\n    # 損失計算\n    # 「ディープラーニングの数学」に合わせて2で割った値を損失とした\n    loss = criterion(outputs, labels1) / 2.0\n\n    # 勾配計算\n    loss.backward()\n\n    # パラメータ修正\n    optimizer.step()\n\n    # 100回ごとに途中経過を記録する\n    if ( epoch % 100 == 0):\n        history = np.vstack((history, np.array([epoch, loss.item()])))\n        print(f'Epoch {epoch} loss: {loss.item():.5f}')"}, {"t": "md", "s": "## 5.9 結果確認"}, {"t": "code", "s": "# 損失初期値と最終値\n\nprint(f'損失初期値: {history[0,1]:.5f}')\nprint(f'損失最終値: {history[-1,1]:.5f}')"}, {"t": "code", "s": "\n# 学習曲線の表示 (損失)\n# 最初の1つを除く\n\nplt.plot(history[1:,0], history[1:,1], 'b')\nplt.xlabel('繰り返し回数')\nplt.ylabel('損失')\nplt.title('学習曲線(損失)')\nplt.show()"}, {"t": "code", "s": "# 回帰直線の算出\n\n# xの最小値、最大値\nxse = np.array((x.min(), x.max())).reshape(-1,1)\nXse = torch.tensor(xse).float()\n\nwith torch.no_grad():\n  Yse = net(Xse)\n\nprint(Yse.numpy())"}, {"t": "code", "s": "# 散布図と回帰直線の描画\n\nplt.scatter(x, yt, s=10, c='b')\nplt.xlabel('部屋数')\nplt.ylabel('価格')\nplt.plot(Xse.data, Yse.data, c='k')\nplt.title('散布図と回帰直線')\nplt.show()"}, {"t": "md", "s": "## 5.10 重回帰モデルへの拡張"}, {"t": "code", "s": "# 列(LSTAT: 低所得者率)の追加\n\nx_add = x_org[:,feature_names == 'LSTAT']\nx2 = np.hstack((x, x_add))\n\n# shapeの表示\nprint(x2.shape)\n\n# 入力データxの表示\nprint(x2[:5,:])"}, {"t": "code", "s": "# 今度は入力次元数=2\n\nn_input = x2.shape[1]\nprint(n_input)\n\n# モデルインスタンスの生成\nnet = Net(n_input, n_output)"}, {"t": "code", "s": "# モデル内のパラメータの確認\n# predict.weight が2次元に変わった\n\nfor parameter in net.named_parameters():\n    print(f'変数名: {parameter[0]}')\n    print(f'変数値: {parameter[1].data}')"}, {"t": "code", "s": "# モデルの概要表示\n\nprint(net)"}, {"t": "code", "s": "# モデルのサマリー表示\n\nfrom torchinfo import summary\nsummary(net, (2,))"}, {"t": "code", "s": "# 入力変数x2 のテンソル変数化\n# labels, labels1は前のものをそのまま利用\n\ninputs = torch.tensor(x2).float()"}, {"t": "md", "s": "### くり返し計算"}, {"t": "code", "s": "# 初期化処理\n\n# 学習率\nlr = 0.01\n\n# インスタンス生成　(パラメータ値初期化)\nnet = Net(n_input, n_output)\n\n# 損失関数： 平均2乗誤差\ncriterion = nn.MSELoss()\n\n# 最適化関数: 勾配降下法\noptimizer = optim.SGD(net.parameters(), lr=lr)\n\n# 繰り返し回数\nnum_epochs = 50000\n\n# 評価結果記録用 (損失関数値のみ記録)\nhistory = np.zeros((0,2))"}, {"t": "code", "s": "# 繰り返し計算メインループ\n\nfor epoch in range(num_epochs):\n\n    # 勾配値初期化\n    optimizer.zero_grad()\n\n    # 予測計算\n    outputs = net(inputs)\n\n    # 誤差計算\n    # 「ディープラーニングの数学」に合わせて2で割った値を損失とした\n    loss = criterion(outputs, labels1) / 2.0\n\n    # 勾配計算\n    loss.backward()\n\n    # パラメータ修正\n    optimizer.step()\n\n    # 100回ごとに途中経過を記録する\n    if ( epoch % 100 == 0):\n        history = np.vstack((history, np.array([epoch, loss.item()])))\n        print(f'Epoch {epoch} loss: {loss.item():.5f}')"}, {"t": "md", "s": "## 5.11 学習率の変更"}, {"t": "code", "s": "# 繰り返し回数\n#num_epochs = 50000\nnum_epochs = 2000\n\n# 学習率\n#l r = 0.01\nlr = 0.001\n\n# モデルインスタンスの生成\nnet = Net(n_input, n_output)\n\n# 損失関数： 平均2乗誤差\ncriterion = nn.MSELoss()\n\n# 最適化関数: 勾配降下法\noptimizer = optim.SGD(net.parameters(), lr=lr)"}, {"t": "code", "s": "# 繰り返し計算メインループ\n\n# 評価結果記録用 (損失関数値のみ記録)\nhistory = np.zeros((0,2))\n\nfor epoch in range(num_epochs):\n\n    # 勾配値初期化\n    optimizer.zero_grad()\n\n    # 予測計算\n    outputs = net(inputs)\n\n    # 誤差計算\n    loss = criterion(outputs, labels1) / 2.0\n\n    #勾配計算\n    loss.backward()\n\n    # パラメータ修正\n    optimizer.step()\n\n    # 100回ごとに途中経過を記録する\n    if ( epoch % 100 == 0):\n        history = np.vstack((history, np.array([epoch, loss.item()])))\n        print(f'Epoch {epoch} loss: {loss.item():.5f}')"}, {"t": "code", "s": "# 損失初期値、最終値\n\nprint(f'損失初期値: {history[0,1]:.5f}')\nprint(f'損失最終値: {history[-1,1]:.5f}')"}, {"t": "code", "s": "# 学習曲線の表示 (損失)\n\nplt.plot(history[:,0], history[:,1], 'b')\nplt.xlabel('繰り返し回数')\nplt.ylabel('損失')\nplt.title('学習曲線(損失)')\nplt.show()"}, {"t": "code", "s": ""}], "ready": true}, "ch06": {"title": "6章 2値分類", "file": "ch06_bi_classifier.ipynb", "cells": [{"t": "md", "s": "# 6章　2値分類"}, {"t": "code", "s": "# 必要ライブラリの導入\n\n!pip install japanize_matplotlib | tail -n 1\n!pip install torchviz | tail -n 1\n!pip install torchinfo | tail -n 1"}, {"t": "code", "s": "# 必要ライブラリのインポート\n\n%matplotlib inline\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport japanize_matplotlib\nfrom IPython.display import display"}, {"t": "code", "s": "# torch関連ライブラリのインポート\n\nimport torch\nimport torch.nn as nn\nimport torch.optim as optim\nfrom torchinfo import summary\nfrom torchviz import make_dot"}, {"t": "code", "s": "# デフォルトフォントサイズ変更\nplt.rcParams['font.size'] = 14\n\n# デフォルトグラフサイズ変更\nplt.rcParams['figure.figsize'] = (6,6)\n\n# デフォルトで方眼表示ON\nplt.rcParams['axes.grid'] = True"}, {"t": "md", "s": "## 6.5 シグモイド関数"}, {"t": "code", "s": "# NumPy配列でxデータを定義\nx_np = np.arange(-4,   (o.legend || []).forEach(([cls, label], k) => {
    const y = T + 12 + k * 16;
    s += cls.startsWith('ln') || cls === 'dash'
      ? `<line class="${cls}" x1="${W - Rr - 118}" x2="${W - Rr - 100}" y1="${y - 4}" y2="${y - 4}"/>`
      : `<circle class="pt solid ${cls}" cx="${W - Rr - 109}" cy="${y - 4}" r="4"/>`;
    s += `<text x="${W - Rr - 94}" y="${y}">${label}</text>`;
  });
  for (const m of o.marks || []) {
    s += `<circle class="mark" cx="${sx(m.x)}" cy="${sy(m.y)}" r="4.5"/>`;
    if (m.label) s += `<text class="marklbl" x="${sx(m.x) + (m.dx ?? 8)}" y="${sy(m.y) + (m.dy ?? -8)}" text-anchor="${m.anchor || 'start'}">${m.label}</text>`;
  }
  return s + '</svg>';
}
const chartBox = (title, svg) => `<div class="chart"><div class="ct">${title}</div>${svg}</div>`;
/* スライダー付きの早送り表示 */
function player(el, rows, view, opt = {}) {
  el.innerHTML = `<div class="player"><button type="button" class="play">▶ 再生</button>
    <input type="range" min="0" max="${rows.length - 1}" value="${opt.start ?? 0}" aria-label="何回目まで進めるか">
    <span class="ep"></span></div><div class="stats"></div><div class="charts"></div>${opt.after || ''}`;
  const rg = el.querySelector('input'), ep = el.querySelector('.ep'), st = el.querySelector('.stats'), ch = el.querySelector('.charts'), pb = el.querySelector('.play');
  const draw = () => {
    const i = +rg.value, v = view(rows[i], i);
    ep.textContent = v.head; st.innerHTML = v.stats.map(([k, x]) => `<div><span>${k}</span><b>${x}</b></div>`).join('');
    ch.innerHTML = v.charts.join('');
  };
  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; pb.textContent = '▶ 再生'; };
  pb.onclick = () => {
    if (timer) return stop();
    if (+rg.value >= rows.length - 1) rg.value = 0;
    pb.textContent = '❚❚ 停止';
    timer = setInterval(() => { if (+rg.value >= rows.length - 1) return stop(); rg.value = +rg.value + 1; draw(); }, opt.speed || 60);
  };
  rg.oninput = draw; draw();
  return stop;
}

<script>
/* ---------- 本体 ---------- */
const KW = new Set('def class for in return if else elif with import from as None True False and or not while lambda pass'.split(' '));
const BI = new Set('print range len super'.split(' '));
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(line) {
  let out = '', i = 0; const n = line.length;
  while (i < n) {
    const ch = line[i];
    if (ch === '#') { out += `<span class="t-com">${esc(line.slice(i))}</span>`; break; }
    const pre = (ch === 'f' || ch === 'r') && (line[i + 1] === '"' || line[i + 1] === "'") && !/[A-Za-z_0-9]/.test(line[i - 1] || '');
    if (ch === '"' || ch === "'" || pre) {
      const j = pre ? i + 1 : i, q = line[j]; let k = j + 1;
      while (k < n && line[k] !== q) { if (line[k] === '\\') k++; k++; }
      out += `<span class="t-str">${esc(line.slice(i, k + 1))}</span>`; i = k + 1; continue;
    }
    if (/[0-9]/.test(ch) && !/[A-Za-z_0-9.]/.test(line[i - 1] || '')) {
      const m = line.slice(i).match(/^[0-9]*\.?[0-9]+(e-?[0-9]+)?/)[0];
      out += `<span class="t-num">${m}</span>`; i += m.length; continue;
    }
    if (/[A-Za-z_]/.test(ch)) {
      const m = line.slice(i).match(/^[A-Za-z_][A-Za-z_0-9]*/)[0], nx = line[i + m.length];
      const cls = KW.has(m) ? 't-kw' : BI.has(m) ? 't-bi' : nx === '(' ? 't-fn' : '';
      out += cls ? `<span class="${cls}">${m}</span>` : m; i += m.length; continue;
    }
    out += esc(ch); i++;
  }
  return out;
}
function autoDesc(t) {
  if (t.startsWith('!pip')) return { t: 'ライブラリのインストール', say: 'Colab で足りないライブラリを入れる命令。計算には関係しない。' };
  if (t.startsWith('%')) return { t: 'ノートブックの設定', say: 'グラフをノートブックの中に表示するための設定。計算には関係しない。' };
  if (/^(import|from)\b/.test(t)) return { t: 'ライブラリの読み込み', say: '道具を使えるようにするだけ。計算はしない。' };
  if (t.startsWith('print(')) return { t: '画面に表示', say: '値を表示して確認するだけ。計算結果は変わらない。' };
  if (t.startsWith('plt.')) return { t: 'グラフの描画・設定', say: 'グラフの見た目の設定や描画。計算には関係しない。' };
  if (t.startsWith('display(')) return { t: '図を表示', say: '作った図をノートブックに表示する。' };
  if (t.startsWith('return')) return { t: '結果を返す', say: '計算した値を、呼び出した側に返す。' };
  if (/^(def|class)\b/.test(t)) return { t: '定義', say: '関数やクラスの定義。この行だけでは何も計算しない。' };
  if (t.startsWith('for ')) return { t: 'くり返し', say: '下の字下げされた行をくり返し実行する。' };
  return { t: '補助の行', say: '計算の本筋ではない、準備や確認のための行。' };
}
function spanOf(cl, i) {
  let bal = 0, k = i;
  do { for (const ch of cl[k].tx.replace(/#.*$/, '')) { if ('([{'.includes(ch)) bal++; else if (')]}'.includes(ch)) bal--; } k++; } while (bal > 0 && k < cl.length);
  return k - i;
}
const BOOK = {};
function prepare(key) {
  if (BOOK[key]) return BOOK[key];
  const nb = DATA.nb[key], lines = [];
  nb.cells.forEach((c, ci) => { if (c.t === 'code') c.s.split('\n').forEach((tx, li) => lines.push({ ci, li, tx })); });
  const byCell = {}; lines.forEach((l, g) => { l.g = g; (byCell[l.ci] ||= []).push(l); });
  const units = [], used = new Array(lines.length).fill(false);
  for (const st of STEPS[key] || []) {
    const cl = byCell[st.c]; if (!cl) { console.warn('cell?', st); continue; }
    let from = 0;
    if (st.after) from = cl.findIndex(l => l.tx.includes(st.after)) + 1;
    const idx = cl.findIndex((l, i) => i >= from && l.tx.includes(st.m));
    if (idx < 0) { console.warn('line not found', st); continue; }
    const n = st.n || spanOf(cl, idx);
    const u = { start: cl[idx].g, end: cl[Math.min(idx + n, cl.length) - 1].g, step: st, skip: !!st.skip };
    units.push(u); for (let g = u.start; g <= u.end; g++) used[g] = true;
  }
  for (let g = 0; g < lines.length; g++) {
    if (used[g]) continue; const t = lines[g].tx.trim(); if (!t || t.startsWith('#')) continue;
    const cl = byCell[lines[g].ci], n = spanOf(cl, lines[g].li);
    const end = Math.min(g + n - 1, cl[cl.length - 1].g);
    units.push({ start: g, end, auto: autoDesc(t), skip: true });
    for (let h = g; h <= end; h++) used[h] = true;
  }
  units.sort((a, b) => a.start - b.start);
  const owner = new Array(lines.length).fill(-1);
  units.forEach((u, i) => { for (let g = u.start; g <= u.end; g++) owner[g] = i; });
  // 見出し (markdown の # 行) を各セルに対応づける
  const heads = []; let h = [];
  nb.cells.forEach((c, ci) => {
    if (c.t === 'md') for (const ln of c.s.split('\n')) {
      const m = ln.match(/^(#+)\s*(.+)/); if (m) { const lv = m[1].length; h = h.slice(0, lv - 1); h[lv - 1] = m[2].trim(); }
    }
    heads[ci] = h.filter(Boolean);
  });
  return (BOOK[key] = { lines, units, owner, heads });
}

const state = { key: 'ch05', mode: 'key', idx: {} };
try { const s = JSON.parse(localStorage.getItem('dlsteps') || '{}'); Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem('dlsteps', JSON.stringify(state)); } catch (e) {} };
const $ = id => document.getElementById(id);
let stopPlayer = null;

function renderTabs() {
  $('tabs').innerHTML = Object.entries(DATA.nb).map(([k, nb]) =>
    `<button type="button" data-k="${k}" aria-pressed="${k === state.key}" ${nb.ready ? '' : 'disabled title="まだ作っていません"'}>${nb.title}${nb.ready ? '' : '(準備中)'}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { state.key = b.dataset.k; save(); renderAll(); });
  $('mode-key').setAttribute('aria-pressed', state.mode === 'key');
  $('mode-all').setAttribute('aria-pressed', state.mode === 'all');
}
function renderCode() {
  const key = state.key, nb = DATA.nb[key], B = prepare(key); let html = '', no = 0, g = 0;
  nb.cells.forEach((c, ci) => {
    if (c.t === 'md') {
      html += '<div class="md">' + c.s.split('\n').filter(s => s.trim()).map(s => {
        const m = s.match(/^(#+)\s*(.+)/);
        return m ? `<div class="h${Math.min(m[1].length, 3)}">${esc(m[2])}</div>` : `<div class="p">${esc(s)}</div>`;
      }).join('') + '</div>';
      return;
    }
    no++;
    html += `<div class="cell"><div class="lab">In [${no}]</div>`;
    c.s.split('\n').forEach((tx, li) => {
      const ui = B.owner[g], u = B.units[ui];
      const has = u && u.step && !u.skip && u.start === g;
      const dim = !u || (state.mode === 'key' && u.skip);
      html += `<div class="ln${has ? ' has' : ''}${dim ? ' dim' : ''}" data-g="${g}"><span class="no">${li + 1}</span><span class="mk">●</span><span class="tx">${hl(tx) || ' '}</span></div>`;
      g++;
    });
    html += '</div>';
  });
  $('code').innerHTML = html;
  $('code').querySelectorAll('.ln').forEach(el => el.onclick = () => {
    const ui = B.owner[+el.dataset.g];
    if (ui >= 0) { state.idx[key] = ui; save(); renderCurrent(true); }
  });
}
function visible(u) { return state.mode === 'all' || !u.skip; }
function curIndex() {
  const B = prepare(state.key); let i = state.idx[state.key];
  if (i == null || !B.units[i]) i = B.units.findIndex(visible);
  return i;
}
function move(d) {
  const B = prepare(state.key); let i = curIndex();
  for (let j = i + d; j >= 0 && j < B.units.length; j += d) if (visible(B.units[j])) { state.idx[state.key] = j; save(); renderCurrent(true); return; }
}
function renderCurrent(scroll) {
  const key = state.key, B = prepare(key), V = DATA.V[key];
  if (stopPlayer) { stopPlayer(); stopPlayer = null; }
  const i = curIndex(); const u = B.units[i]; if (!u) return;
  state.idx[key] = i;
  document.querySelectorAll('.ln.cur').forEach(e => e.classList.remove('cur', 'first'));
  for (let g = u.start; g <= u.end; g++) {
    const el = $('code').querySelector(`.ln[data-g="${g}"]`);
    if (el) { el.classList.add('cur'); if (g === u.start) el.classList.add('first'); }
  }
  if (scroll) {
    const el = $('code').querySelector(`.ln[data-g="${u.start}"]`), box = $('code');
    if (el) box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight * 0.35);
  }
  const vis = B.units.filter(visible), pos = vis.indexOf(u) + 1;
  $('counter').textContent = pos > 0 ? `${pos} / ${vis.length}` : `補足の行 (全体 ${vis.length} ステップ)`;
  const st = u.step || u.auto, val = x => typeof x === 'function' ? x(V) : x;
  const code = B.lines.slice(u.start, u.end + 1).map(l => l.tx).join('\n');
  const ci = B.lines[u.start].ci, hd = B.heads[ci] || [];
  let h = `<div class="crumb">${hd.map((x, k) => k === hd.length - 1 ? `<b>${esc(x)}</b>` : esc(x)).join(' › ')}</div>`;
  h += `<div class="headrow"><span class="tag${u.skip ? ' sub' : ''}">${u.skip ? '補足' : '要点'}</span><h2 class="title">${st.t}</h2></div>`;
  h += `<div class="block"><div class="lbl">いま実行している行</div><div class="echo">${hl(code.replace(/^\s+/gm, m => m))}</div></div>`;
  if (st.say) h += `<div class="block"><div class="lbl">何をしている?</div><div class="say">${val(st.say)}</div></div>`;
  if (st.flow) h += `<div class="block"><div class="lbl">流れ</div><div class="flow">${val(st.flow)}</div></div>`;
  if (st.eq) h += `<div class="block"><div class="lbl">数式</div><div class="eqs">${[].concat(val(st.eq)).map(e => `<div class="eq">$$${e}$$</div>`).join('')}</div></div>`;
  if (st.val) h += `<div class="block"><div class="lbl">実際の値</div><div class="vals">${val(st.val)}</div></div>`;
  if (st.chart) h += `<div class="block"><div class="lbl">図</div><div class="charts">${[].concat(val(st.chart)).join('')}</div></div>`;
  if (st.inter) h += `<div class="block"><div class="lbl">早送り</div><div class="vals" id="inter"></div></div>`;
  if (st.note) h += `<div class="note">${val(st.note)}</div>`;
  $('vis').innerHTML = h;
  if (st.inter) stopPlayer = st.inter($('inter'), V) || null;
  $('vispane').scrollTop = 0;
  typeset();
}
function typeset() {
  if (window.MathJax && MathJax.typesetPromise) {
    MathJax.typesetClear && MathJax.typesetClear([$('vis')]);
    MathJax.typesetPromise([$('vis')]).catch(e => console.warn(e));
  }
}
function renderAll() {
  if (!DATA.nb[state.key] || !DATA.nb[state.key].ready) state.key = Object.keys(DATA.nb).find(k => DATA.nb[k].ready);
  renderTabs(); renderCode(); renderCurrent(true);
}
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);
$('mode-key').onclick = () => { state.mode = 'key'; save(); const B = prepare(state.key), i = curIndex(); if (B.units[i].skip) { const j = B.units.findIndex((u, k) => k >= i && !u.skip); if (j >= 0) state.idx[state.key] = j; } renderAll(); };
$('mode-all').onclick = () => { state.mode = 'all'; save(); renderAll(); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); move(1); }
  if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); move(-1); }
});
renderAll();
</script>
